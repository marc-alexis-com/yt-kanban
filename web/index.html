<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>To watch</title>
    <script>
      // Apply the saved theme before the first paint (no dark flash in light mode).
      // Same key as web/src/stores/settings.js.
      try {
        const saved = JSON.parse(localStorage.getItem('yt-kanban:settings'));
        if (saved && saved.theme) document.documentElement.dataset.theme = saved.theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
